  (ra2yr-test-saves, made afresh and removed at the end): what is a save and
  what is not, a zip out and back, a zip made by another program (Python's
  zipfile: a folder in it, macOS's entries, stored and deflated), a save of
  the same name in another case replaced, not doubled, and a damaged zip
  refused. The exported zip is printed ("[saves] zip i/n BASE64") for a
  check by another program. node tools/chrome.mjs --page tests/saves (the
  page sets its title to EXIT 0 or EXIT 1).
-->

const root = await navigator.storage.getDirectory();
try {
  await root.removeEntry(SET, { recursive: true }).catch(() => {});
  const dir = await root.getDirectoryHandle(SET, { create: true });
  const put = async (d, name, bytes) => { const w = await (await d.getFileHandle(name, { create: true })).createWritable(); await w.write(bytes); await w.close(); };
  await put(dir, 'SAVE0001.SAV', data(1, 2000000));
  await put(dir, 'save0002.sav', data(2, 9000));
  await put(dir, 'RA2MD.INI', new TextEncoder().encode('[Options]\n'));
  await put(dir, 'SAVE00G1.SAV', data(3, 100));
  await put(await dir.getDirectoryHandle('Saved', { create: true }), 'SAVE0003.SAV', data(3, 100));

  const list = await listSaves(SET);
  check(list.map((s) => s.name).join() === 'SAVE0001.SAV,save0002.sav', `the saves: ${list.map((s) => s.name).join(', ')} (not RA2MD.INI, SAVE00G1.SAV, Saved/SAVE0003.SAV)`);
  const zip = await exportSaves(SET);
  check(zip.size > 0 && zip.size < 100000, `exported: ${zip.size} bytes for ${list.reduce((n, s) => n + s.size, 0)}`);
  const bytes = new Uint8Array(await zip.arrayBuffer()), b64 = btoa(String.fromCharCode(...bytes)), n = Math.ceil(b64.length / 8000);
  for (let i = 0; i < n; i++) console.log(`[saves] zip ${i + 1}/${n} ${b64.slice(i * 8000, (i + 1) * 8000)}`);
  const back = await readSaves(zip);
  check(back.length === 2 && back[0].name === 'SAVE0001.SAV' && same(back[0].data, data(1, 2000000))
        && back[1].name === 'SAVE0002.SAV' && same(back[1].data, data(2, 9000)), `read back: ${back.map((e) => `${e.name} ${e.data.length}`).join(', ')}`);

  const py = await readSaves(new Blob([fromB64(PYTHON_ZIP)]));
  check(py.map((e) => e.name).join() === 'SAVE0005.SAV,SAVE0006.SAV,SAVE0002.SAV', `Python's zip: ${py.map((e) => `${e.name} ${e.data.length}`).join(', ')}`);
  check(same(py[0].data, data(5, 300000)) && same(py[1].data, data(6, 1500)) && same(py[2].data, data(22, 7000)), "Python's zip: the bytes");
  await writeSaves(SET, py);
  const after = await listSaves(SET);
  check(after.map((s) => s.name).join() === 'SAVE0001.SAV,save0002.sav,SAVE0005.SAV,SAVE0006.SAV', `imported: ${after.map((s) => `${s.name} ${s.size}`).join(', ')}`);
  const two = after.find((s) => s.name === 'save0002.sav');
  check(two && same(new Uint8Array(await two.file.arrayBuffer()), data(22, 7000)), 'save0002.sav replaced by SAVE0002.SAV, not a second file beside it');

  const bad = new Uint8Array(bytes); bad[200] ^= 0xFF;
  const err = async (b) => { try { await readSaves(new Blob([b])); return 'read'; } catch (x) { return x.message; } };
  const e1 = await err(bad), e2 = await err(new TextEncoder().encode('not a zip at all'));
  check(/损坏/.test(e1), `a damaged zip: ${e1}`);
  check(/不是 zip/.test(e2), `not a zip: ${e2}`);
} catch (x) { check(false, `threw: ${x.stack ?? x}`); }
await root.removeEntry(SET, { recursive: true }).catch(() => {});
say(fails ? `${fails} failed` : 'all passed');
document.title = `EXIT ${fails ? 1 : 0}`;
